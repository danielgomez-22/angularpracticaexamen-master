<div class="min-h-[80vh] flex items-center justify-center bg-gray-100 px-4 py-10">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
    <!-- Título -->
    <div class="text-center mb-8">
      <div
        class="w-14 h-14 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-4"
      >
        <span class="text-3xl">🔐</span>
      </div>

      <h1 class="text-3xl font-bold text-gray-800">Iniciar sesión</h1>

      <p class="text-gray-500 mt-2 text-sm">Introduce tus credenciales para continuar</p>
    </div>

    <form #formLogin="ngForm" class="space-y-5">
      <!-- Usuario -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2"> Usuario </label>

        <input
          type="text"
          #cajausuario
          name="cajausuario"
          placeholder="Introduce tu usuario"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl text-gray-800 placeholder-gray-400 outline-none transition-all focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2"> Contraseña </label>

        <input
          type="password"
          #cajapassword
          name="cajapassword"
          placeholder="Introduce tu contraseña"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl text-gray-800 placeholder-gray-400 outline-none transition-all focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500"
        />
      </div>

      <!-- Separador -->
      <hr class="border-gray-200" />

      <!-- Botón -->
      <button
        type="button"
        (click)="login()"
        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200"
      >
        Iniciar sesión
      </button>
    </form>

    <!-- Pie -->
    <p class="text-center text-xs text-gray-400 mt-6">Nexus · Acceso de usuarios</p>
  </div>
</div>
