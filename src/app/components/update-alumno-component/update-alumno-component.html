<div class="max-w-xl mx-auto mt-10 p-8 bg-white rounded-2xl shadow-xl border border-gray-100">
  <h1 class="text-3xl font-extrabold text-gray-800 mb-6 text-center">Modificar alumno</h1>

  <form #formCreate="ngForm" class="space-y-4">
      <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">ID Alumno</label>
          <input type="number" #cajaid name="cajaid" disabled class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed"/>
      </div>

      <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre</label>
          <input type="text" #cajanombre name="cajanombre" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"/>
      </div>

      <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Apellidos</label>
          <input type="text" #cajaapellidos name="cajaapellidos" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"/>
      </div>

      <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Imagen</label>
          <input type="text" #cajaimagen name="cajaimagen" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"/>
      </div>

      <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Activo</label>
          <input type="number" #cajaactivo name="cajaactivo" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"/>
      </div>

      <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">ID Curso</label>
          <input type="number" #cajaidcurso name="cajaidcurso" disabled class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed"/>
      </div>

      <button type="button" (click)="modificarAlumno()" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition-colors mt-6 cursor-pointer">Modificar</button>
  </form>
</div>
